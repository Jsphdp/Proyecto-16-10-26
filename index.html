<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    .header-sencillo {
      background-color: #f4f4f9;
      color: #333;
      padding: 30px;
      text-align: center;
      border-bottom: 3px solid #ff6b6b;
      font-family: sans-serif;
    }

    .header-sencillo h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
    }

    .header-sencillo p {
      margin: 0;
      color: #666;
    }
  </style>
</head>
<body>

  <header class="header-sencillo">
    <h1>¡Hola, palette!</h1>
    <p>Que tal estás?</p>
    <p>Hola, ¿cómo estás?</p>
  </header>

</body>
</html>
